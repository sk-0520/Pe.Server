services:
  www:
    build: ./images/www
    container_name: www-container
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - type: bind
        source: ../
        target: /app
        consistency: cached
    #   # 設定ディレクトリ
    #   # うまいこと調整が必要
    #   - type: bind
    #     source: X:/
    #     target: /app-data
    #     consistency: delegated
    depends_on:
      - mail

  mail:
    image: axllent/mailpit:v1.20
    container_name: mail-container
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      TZ: Asia/Tokyo
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
